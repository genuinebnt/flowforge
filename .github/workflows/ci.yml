# CI stages of spec 25.11 adapted to Go, plus the PR items of 17.6.
#   fast         every push: gofmt, vet, staticcheck, govulncheck, arch test,
#                unit + conformance + property tests (1,000 cases) with -race,
#                per-module contract (xtask verify-module)
#   integration  every PR: Postgres 16, Redis 7 and the Pub/Sub emulator;
#                adapter, service and EventStore tests
#   fuzz-smoke   every PR: 60 s per fuzz target
#   docker       every PR: build every cmd/<service> image, SBOM, vulnerability
#                scan that blocks high-severity findings (spec 18.2)
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -s -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: architecture rules
        run: go test -count=1 ./internal/archtest

      - name: unit, conformance and property tests (race, 1,000 cases)
        env:
          FF_PROPTEST_CASES: "1000"
        run: go test -race -count=1 -shuffle=on ./...

      - name: module contract (xtask verify-module)
        run: |
          for m in $(go run ./cmd/xtask list | awk '{print $1}'); do
            echo "::group::verify-module $m"
            go run ./cmd/xtask verify-module "$m"
            echo "::endgroup::"
          done

  integration:
    name: integration
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flowforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FF_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/flowforge?sslmode=disable
      FF_TEST_REDIS_ADDR: localhost:6379
      PUBSUB_EMULATOR_HOST: localhost:8085
      FF_PUBSUB_PROJECT: ff-local
      FF_TOPIC_PREFIX: ff.
      FF_PROPTEST_CASES: "1000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Postgres extensions (pg_trgm, citext)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d flowforge -v ON_ERROR_STOP=1 -f deploy/initdb/01-extensions.sql

      - name: Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project="$FF_PUBSUB_PROJECT"
          for _ in $(seq 1 60); do
            curl -fsS "http://$PUBSUB_EMULATOR_HOST/" >/dev/null 2>&1 && break
            sleep 2
          done
          sh deploy/pubsub-init.sh

      - name: adapter, service and EventStore tests
        run: go test -race -count=1 -timeout 30m ./...

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: fuzz smoke
        run: go run ./cmd/xtask fuzz-smoke -fuzztime 60s

      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  images:
    name: list images
    needs: fast
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: list
        name: cmd/<service> directories with a main package
        run: |
          services="$(find cmd -mindepth 2 -maxdepth 2 -name main.go -printf '%h\n' \
            | xargs -r -n1 basename | grep -vx xtask | sort | jq -R . | jq -cs .)"
          echo "services=${services:-[]}" >> "$GITHUB_OUTPUT"
          echo "images: ${services:-[]}"

  docker:
    name: docker ${{ matrix.service }}
    needs: images
    if: needs.images.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.images.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          tags: flowforge/${{ matrix.service }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: runs as nonroot
        run: test "$(docker inspect -f '{{.Config.User}}' flowforge/${{ matrix.service }}:ci)" = "65532:65532"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: flowforge/${{ matrix.service }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      - name: vulnerability scan (blocks high and critical)
        uses: anchore/scan-action@v6
        with:
          image: flowforge/${{ matrix.service }}:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
