# Machine-readable module manifest (spec 24.3, 25.10), Go edition.
#
# Each [module.<name>] maps a spec "crate" to a Go package directory.
# `go run ./cmd/xtask verify-module <name>` checks an entry against the code:
#   tests.prefix   Go test functions are named Test<prefix><id>_<Description>
#   properties     property-test function names (Test<Prefix>Prop_<Name>)
#   fuzz           native Go fuzz targets
#   bench          benchmark function-name prefixes (Benchmark<Prefix><NN>)
#   conformance    directories under conformance/ that must be non-empty

[module.core]
layer = 0
spec = ["1.2", "11.1", "24.4"]
dir = "core"
depends = []
tests = { prefix = "Core", required = ["001", "002", "003", "004", "005", "006", "007"] }

[module.netnorm]
layer = 0
spec = ["4.2"]
dir = "core/netnorm"
depends = []
tests = { prefix = "", required = [] }
properties = ["TestNetnormProp_Idempotent"]
fuzz = ["FuzzNetnormURL"]

[module.scope]
layer = 1
spec = ["4"]
dir = "scope"
depends = ["core", "netnorm"]
tests = { prefix = "Scope", required = ["001", "002", "003", "004", "005", "006", "007", "008", "009", "010", "011", "012", "013", "014", "015", "016"] }
conformance = ["scope/normalize", "scope/decide"]
properties = ["TestScopeProp_IdempotentNormalize", "TestScopeProp_DenyMonotone"]
fuzz = ["FuzzScopeNormalize"]
bench = ["BenchmarkScope01"]
mutation = true

