# Local plugins only (no remote buf.build plugins). Install them with
# scripts/genproto.sh, which pins the versions. No `clean: true`: gen/ also
# holds hand-written tests; genproto.sh deletes stale *.pb.go files itself.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
